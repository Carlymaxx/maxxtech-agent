version: "3.9"

services:
  app:
    build: .
    container_name: maxxtech-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - AI_INTEGRATIONS_ANTHROPIC_BASE_URL=${AI_INTEGRATIONS_ANTHROPIC_BASE_URL}
      - AI_INTEGRATIONS_ANTHROPIC_API_KEY=${AI_INTEGRATIONS_ANTHROPIC_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: maxxtech-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=maxxtech
      - POSTGRES_USER=maxxtech
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxxtech"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: maxxtech-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

volumes:
  postgres_data:
